[project]
name = "target-ai"
version = "0.1.0"
description = "Агентная система таргета Instagram с управлением через Telegram"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiogram>=3.31,<4",
    "anthropic>=2.6,<3",
    "httpx>=0.28",
    "pydantic>=2.12,<2.14",
    "pydantic-settings>=2.16",
    "tzdata",
]

[dependency-groups]
dev = ["pytest>=9", "pytest-asyncio", "pytest-cov", "httpx2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/target_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
asyncio_default_fixture_loop_scope = "function"
